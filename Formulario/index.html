<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feedback form </title>
</head>

<body>
    
    <h1>Formulario</h1>

<form >


    <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="email">
    </div>

    <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
    </div>

    <div>
        <label for="clave">clave</label>
        <input type="password" id="clave" name="password">
    </div>


    <div>

        <p>please check all the emotions that apply to you</p>


        <ul>


            <li>
                <label for="angry">Angry</label>
                <input type="checkbox" id="angry" name="lang-know">
            </li>

            <li>
                <label for="sad">Sad</label>
                <input type="checkbox" id="sad" name="lang-know">
            </li>

            <li>
                <label for="hapy">Hapy</label>
                <input type="checkbox" id="hapy" name="lang-know">
            </li>

            <li>
                <label for="ambivalent">Hambivalent</label>
                <input type="checkbox" id="ambivalent" name="lang-know">
            </li>



            <p>How satisfied were you with our service</p>



            <li>
                <label for="verysatisfied">verysatisfied</label>
                <input type="radio" id="verysatisfied" name="answer">
            </li>

            <li>
                <label for="satisfied">Satisfied</label>
                <input type="radio" id="satisfied" name="answer">
            </li>

            <li>
                <label for="didntcare">didntcare</label>
                <input type="radio" id="didntcare" name="answer">
            </li>

            <li>
                <label for="dissatisfied">Disastisfied</label>
                <input type="radio" id="dissatisfied" name="answer">
            </li>
            
            <li>
                <label for="verysatisfied">Verysatisfied</label>
                <input type="radio" id="verysatisfied" name="answer">
            </li>
        </ul>
    </div>

    <div>

        <label for="further comments">Further comments</label>

        <textarea name="texto" id="Further comments" rows="5" cols="30"></textarea>

    </div>

    <div>

        <label for="bio photo">Bio photo</label>
        <input type="file" id="bio photo" name="accept"image/*>


    </div>

    <div>
        <label for="pais">Nacionalidad</label>

        <selec name"Nacionalidad" id="pais">
            <option value="ar">Argentina</option>
            <option value="al">Alemania</option>
            <option value="br">Brasil</option>
            <option value="fr">Francia</option>
            <option value="es">Espanol</option>
            <option value="ur">Uruguayo</option>
            <option value="ca">Canadience</option>
            <option value="no">Noruego</option>
            <option value="ru">Ruso</option>
            <option value=""selected disabled>No seleccionado</option>

    </select>
    </div>

    <div>
        <button type="submit">Enviar</button>
    </div>
</form>

</body>
</html>
